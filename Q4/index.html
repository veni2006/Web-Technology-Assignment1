<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #163ea8;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            background: #eef4ff;
            border-radius: 8px;
            display: none;
        }
        #result h2 {
            color: #1d4ed8;
            margin-top: 0;
        }
        .pass {
            color: green;
            font-weight: bold;
        }
        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Grade Calculator</h1>
        <label>Subject 1 Marks</label>
        <input type="number" id="mark1" min="0" max="100">
        <label>Subject 2 Marks</label>
        <input type="number" id="mark2" min="0" max="100">
        <label>Subject 3 Marks</label>
        <input type="number" id="mark3" min="0" max="100">
        <label>Subject 4 Marks</label>
        <input type="number" id="mark4" min="0" max="100">
        <label>Subject 5 Marks</label>
        <input type="number" id="mark5" min="0" max="100">
        <button onclick="calculateGrade()">
            Calculate Result
        </button>
        <div id="result">
            <h2>Result</h2>
            <p>
                <strong>Total:</strong>
                <span id="total"></span>
            </p>
            <p>
                <strong>Average:</strong>
                <span id="average"></span>
            </p>
            <p>
                <strong>Grade:</strong>
                <span id="grade"></span>
            </p>
            <p>
                <strong>Status:</strong>
                <span id="status"></span>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
