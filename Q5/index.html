<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Bill Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 25px;
        }
        h2 {
            color: #2e7d32;
            border-bottom: 2px solid #81c784;
            padding-bottom: 8px;
        }
        .product {
            background: #f9fff9;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
        }
        .product h3 {
            margin-top: 0;
            color: #388e3c;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background: #1b5e20;
        }
        #bill {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f8e9;
            border-radius: 10px;
        }
        .bill-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
        .discount {
            color: #d32f2f;
            font-weight: bold;
        }
        .final {
            border-top: 2px solid #2e7d32;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Supermarket Bill</h1>
        <h2>Product Details</h2>
        <div class="product">
            <h3>Product 1</h3>
            <label>Quantity</label>
            <input
                type="number"
                id="quantity1"
                min="1"
                placeholder="Enter quantity"
            >
            <label>Unit Price (₹)</label>
            <input
                type="number"
                id="price1"
                min="0"
                placeholder="Enter unit price"
            >
        </div>
        <div class="product">
            <h3>Product 2</h3>
            <label>Quantity</label>
            <input
                type="number"
                id="quantity2"
                min="1"
                placeholder="Enter quantity"
            >
            <label>Unit Price (₹)</label>
            <input
                type="number"
                id="price2"
                min="0"
                placeholder="Enter unit price"
            >
        </div>
        <div class="product">
            <h3>Product 3</h3>
            <label>Quantity</label>
            <input
                type="number"
                id="quantity3"
                min="1"
                placeholder="Enter quantity"
            >
            <label>Unit Price (₹)</label>
            <input
                type="number"
                id="price3"
                min="0"
                placeholder="Enter unit price"
            >
        </div>
        <button onclick="generateBill()">
            Generate Bill
        </button>
        <div id="bill">
            <h2>Bill Summary</h2>
            <div class="bill-row">
                <span>
                    Product 1 Amount:
                </span>
                <span id="amount1">
                    ₹0
                </span>
            </div>
            <div class="bill-row">
                <span>
                    Product 2 Amount:
                </span>
                <span id="amount2">
                    ₹0
                </span>
            </div>
            <div class="bill-row">
                <span>
                    Product 3 Amount:
                </span>
                <span id="amount3">
                    ₹0
                </span>
            </div>
            <div class="bill-row">
                <span>
                    Total Bill:
                </span>
                <span id="total">
                    ₹0
                </span>
            </div>
            <div class="bill-row discount">
                <span>
                    Discount (10%):
                </span>
                <span id="discount">
                    ₹0
                </span>
            </div>
            <div class="bill-row final">
                <span>
                    Final Amount:
                </span>
                <span id="finalAmount">
                    ₹0
                </span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
